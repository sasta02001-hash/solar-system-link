name: Publish reviewed SSS single-file installer r2 candidate
on:
  push:
    branches: [main]
    paths: [updates/sss-installer-r2/publish-request.json]
permissions:
  contents: write
concurrency:
  group: sss-single-installer-r2-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sasta02001-hash/solar-system-link' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read reviewed SSS wrapper inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and publish the fixed create-once SSS prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sss_installer_r2_publisher.py
