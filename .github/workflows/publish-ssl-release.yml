name: Publish verified SSL update
on:
  push:
    branches: [main]
    paths: [updates/ssl/publish-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ssl-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sasta02001-hash/solar-system-link' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read reviewed release inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and publish SSL assets before channel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ssl_release_publisher.py
