name: Publish verified SSS CurrentUser UI assets
on:
  push:
    branches: [main]
    paths: [updates/sss-ui/publish-request.json]
permissions:
  contents: write
concurrency:
  group: sss-current-user-ui-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sasta02001-hash/solar-system-link' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read reviewed public SSS UI bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify ZIP before version publication and stable rotation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sss_ui_release_publisher.py
